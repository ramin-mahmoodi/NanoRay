name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify MinGW Compiler
        run: |
          g++ --version
          windres --version

      - name: Compile Windows Resources
        run: windres resources/resource.rc -O coff -o resource.o

      - name: Build NanoRay (Pure C++ / MinGW Static)
        run: g++ -O3 -s -std=c++17 -D_WIN32_WINNT=0x0A00 -DNOMINMAX -Isrc src/main.cpp src/config.cpp src/tunnel.cpp src/ui_flyout.cpp resource.o -o NanoRay.exe -static -static-libgcc -static-libstdc++ -lws2_32 -liphlpapi -lgdiplus -ldwmapi -lshell32 -lpsapi -lole32 -lgdi32 -luser32 -lwinhttp -lsecur32 -lcrypt32 -lbcrypt -mwindows

      - name: Download official signed Wintun driver (x64)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
          $zipHash = (Get-FileHash "wintun.zip" -Algorithm SHA256).Hash.ToLower()
          if ($zipHash -ne "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51") {
            throw "wintun.zip SHA256 mismatch: $zipHash"
          }
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_tmp"
          $dllHash = (Get-FileHash "wintun_tmp/wintun/bin/amd64/wintun.dll" -Algorithm SHA256).Hash.ToLower()
          if ($dllHash -ne "e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce") {
            throw "wintun.dll SHA256 mismatch: $dllHash"
          }
          Copy-Item "wintun_tmp/wintun/bin/amd64/wintun.dll" -Destination "wintun.dll"
          Remove-Item "wintun.zip", "wintun_tmp" -Recurse -Force

      - name: Package Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force
          Copy-Item "NanoRay.exe" -Destination "dist/"
          Copy-Item "wintun.dll" -Destination "dist/"
          Compress-Archive -Path "dist/*" -DestinationPath "NanoRay-windows-x64.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanoRay-windows-x64
          path: NanoRay-windows-x64.zip

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: NanoRay ${{ github.ref_name }}
          body: |
            Release **NanoRay ${{ github.ref_name }}** (Windows x64).
            
            ### Included in release:
            - `NanoRay.exe` (System-wide VLESS & Trojan tunnel client)
            - `wintun.dll` (Official signed x64 Wintun driver)
          files: NanoRay-windows-x64.zip
          draft: false
          prerelease: false
