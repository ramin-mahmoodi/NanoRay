name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build NanoRay
        run: cmake --build build --config Release

      - name: Download official signed Wintun driver (x64)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_tmp"
          Copy-Item "wintun_tmp/wintun/bin/amd64/wintun.dll" -Destination "build/Release/wintun.dll"
          Remove-Item "wintun.zip", "wintun_tmp" -Recurse -Force

      - name: Package Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force
          Copy-Item "build/Release/NanoRay.exe" -Destination "dist/"
          Copy-Item "build/Release/wintun.dll" -Destination "dist/"
          Copy-Item "README.md" -Destination "dist/"
          Compress-Archive -Path "dist/*" -DestinationPath "NanoRay-windows-x64.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanoRay-windows-x64
          path: NanoRay-windows-x64.zip

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'NanoRay Latest' }}
          body: |
            Automated build of **NanoRay** (Windows x64).
            
            ### Included in release:
            - `NanoRay.exe` (System-wide VLESS & Trojan tunnel client)
            - `wintun.dll` (Official signed x64 Wintun driver)
            - `README.md`
          files: NanoRay-windows-x64.zip
          draft: false
          prerelease: false
